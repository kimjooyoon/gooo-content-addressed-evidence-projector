name: content-addressed evidence projector CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4
      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Run validation and deterministic acceptance in Actions
        shell: bash
        run: bash scripts/ci-evidence.sh
      - name: Publish human report to job summary
        if: always()
        shell: bash
        run: |
          report="${RUNNER_TEMP}/gooo-content-addressed-evidence-projector/output/report.md"
          if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload retained CI evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-addressed-evidence-projector-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gooo-content-addressed-evidence-projector/**
          if-no-files-found: warn
          retention-days: 90
